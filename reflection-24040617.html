<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặng Quang Minh · Trí Tuệ Đồng Hành – Kỷ nguyên sống và làm việc cùng AI</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><nav class="nav"><a class="brand" href="index.html"><span class="brandmark">S</span> SNACK BOX</a><div class="navlinks"><a href="index.html">Trang chủ</a><a href="business-plan.html">Kế hoạch</a><a href="financial-analysis.html">Tài chính</a><a href="swot.html">SWOT</a><a href="five-forces.html">Porter</a><a class="active" href="reflections.html">Phản hồi</a><a href="action-plan.html">90 ngày</a></div></nav><main class="prose"><a class="back" href="reflections.html">← Tất cả phản hồi</a><span class="eyebrow">Bài phản hồi · 24040617</span><h1>Đặng Quang Minh</h1><p class="muted">Trí Tuệ Đồng Hành – Kỷ nguyên sống và làm việc cùng AI</p><article id="article"></article></main><footer class="footer">Nguồn: reflections/24040617 - Đặng Quang Minh.md</footer></div><script>const source="\nHọ Và Tên: Đặng Quang Minh\nTác Giả: Ethan Mollick\nTên Sách: Trí Tuệ Đồng Hành – Kỷ nguyên sống và làm việc cùng AI\n\n**Co-Intelligence: Trí Tuệ Đồng Hành - Kỷ nguyên sống và làm việc cùng AI của tác giả Ethan Mollick.**\n\nKể từ khi ChatGPT ra mắt vào cuối năm 2022, trí tuệ nhân tạo (AI) phát triển nhanh và hiện diện ngày càng nhiều trong học tập, công việc, đời sống. AI hỗ trợ tìm kiếm thông tin, viết nội dung, phân tích dữ liệu và phát triển ý tưởng. Tuy nhiên, con người cũng đứng trước hai thái cực: lo ngại bị AI thay thế hoặc phụ thuộc công nghệ mà không kiểm tra kết quả.\n\nĐối với sinh viên, AI giúp tiết kiệm thời gian, nhưng phụ thuộc quá mức có thể làm suy giảm cơ hội rèn luyện tư duy độc lập và phản biện. Cuốn sách *Trí Tuệ Đồng Hành – Kỷ nguyên sống và làm việc cùng AI* (tựa gốc: *Co-Intelligence: Living and Working with AI*) của Ethan Mollick, xuất bản năm 2024, đưa ra góc nhìn về cách con người hợp tác với AI. Tác phẩm khuyến khích xem AI như một cộng sự có thể mở rộng năng lực tư duy và sáng tạo, nhưng con người vẫn phải giữ vai trò định hướng, kiểm soát và chịu trách nhiệm.\n\nTrước khi đọc sách, tôi thường xem AI như một công cụ tìm kiếm nâng cấp: đặt câu hỏi và nhận câu trả lời. Ethan Mollick khuyến khích cách tiếp cận chủ động hơn: tương tác với AI như một cộng sự hoặc người hỗ trợ tư duy. Đây là cách xác định vai trò để phối hợp hiệu quả, không có nghĩa AI thực sự là con người. Thay vì yêu cầu AI viết toàn bộ bài luận, người học có thể trình bày luận điểm của mình và yêu cầu AI phản biện, tìm điểm chưa hợp lý hoặc đề xuất hướng phát triển. AI hỗ trợ tư duy, còn người học xác định mục tiêu, lựa chọn ý tưởng và quyết định kết quả cuối cùng.\n\nTác giả nêu bốn nguyên tắc: chủ động mời AI tham gia khi phù hợp; luôn giữ con người trong vòng kiểm soát; xác định rõ vai trò và yêu cầu khi giao tiếp; đồng thời liên tục học hỏi để thích nghi với sự phát triển của AI. Theo tôi, điều quan trọng không chỉ là biết dùng công cụ, mà còn là biết đặt vấn đề, phản biện và đánh giá kết quả. Trong nhiều vai trò được đề cập, tôi nhận thấy gia sư cá nhân hóa và đối tác sáng tạo là hai hình thức ứng dụng gần gũi nhất.\n\n**AI như một gia sư cá nhân hóa:** Khi gặp kiến thức khó, người học có thể yêu cầu AI giải thích bằng ngôn ngữ đơn giản, chia nhỏ nội dung, đưa ví dụ hoặc đặt câu hỏi để kiểm tra mức độ hiểu bài. AI cũng có thể gợi mở từng bước thay vì đưa đáp án ngay. Cách học này khuyến khích sinh viên chủ động suy nghĩ và hiểu bản chất vấn đề.\n\n**AI như một đối tác sáng tạo:** Khi làm bài tập lớn hoặc dự án nhóm, AI có thể hỗ trợ xây dựng dàn ý, đề xuất hướng tiếp cận và gợi ý ý tưởng. Chẳng hạn, trong một dự án kinh doanh dành cho sinh viên, AI có thể gợi ý sản phẩm hoặc phương án truyền thông. Tuy nhiên, người học cần đánh giá tính khả thi dựa trên mục tiêu, nguồn lực và thông tin thực tế. AI giúp mở rộng góc nhìn, còn việc lựa chọn và phát triển ý tưởng vẫn thuộc về con người.\n\nMột khái niệm đáng chú ý trong sách là “Ranh giới gồ ghề” (Jagged Frontier), mô tả năng lực không đồng đều của AI: hệ thống có thể làm tốt nhiệm vụ phức tạp nhưng vẫn mắc lỗi ở việc tưởng chừng đơn giản. Vì vậy, không thể mặc nhiên cho rằng AI luôn chính xác.\n\nCâu trả lời mạch lạc, tự tin không đồng nghĩa với thông tin đúng. AI đôi khi tạo ra thông tin không có thật nhưng trình bày như sự thật, gọi là ảo giác AI (AI Hallucination). Nếu không kiểm chứng, sinh viên có thể đưa thông tin sai vào bài làm. Giao toàn bộ việc tìm ý tưởng, phân tích và viết nội dung cho AI cũng làm giảm cơ hội tự rèn luyện tư duy.\n\nTừ đó, tôi đề xuất quy trình năm bước để sử dụng AI có kiểm soát:\n\n**Tự suy nghĩ và xác định định hướng:** Làm rõ vấn đề, mục tiêu và hiểu biết ban đầu.\n\n**Tham vấn AI:** Yêu cầu giải thích, gợi ý ý tưởng hoặc hỗ trợ nhiệm vụ phù hợp.\n\n**Kiểm chứng thông tin:** Đối chiếu nội dung quan trọng với tài liệu đáng tin cậy và dữ liệu thực tế.\n\n**Tự đánh giá, tinh chỉnh:** Bổ sung quan điểm cá nhân và điều chỉnh kết quả theo mục tiêu.\n\n**Quyết định cuối cùng:** Tự lựa chọn và chịu trách nhiệm về sản phẩm được sử dụng.\n\nQuy trình này giúp tận dụng AI mà vẫn giữ vai trò chủ động của người học.\n\nĐiểm mạnh của *Trí Tuệ Đồng Hành* là phân tích tác động của AI đến tư duy, sáng tạo và cách làm việc. Hình ảnh AI như gia sư, đồng nghiệp hay đối tác sáng tạo giúp người đọc hình dung các cách tương tác phù hợp.\n\nTuy nhiên, tác phẩm cũng có những điểm cần nhìn nhận thận trọng. Thứ nhất, AI phát triển nhanh nên ví dụ hoặc công cụ được đề cập ở thời điểm sách xuất bản năm 2024 có thể không còn phản ánh đầy đủ tình hình hiện tại. Người đọc cần tiếp tục cập nhật kiến thức, thay vì xem sách như tài liệu hướng dẫn một phần mềm cố định.\n\nThứ hai, nhân cách hóa AI giúp giao tiếp thuận tiện nhưng có thể khiến người dùng đánh giá quá cao độ tin cậy của hệ thống. AI vẫn có giới hạn, không thể thay thế phán đoán và trách nhiệm của con người. Thứ ba, nội dung đòi hỏi độ chính xác hoặc liên quan đến quyết định quan trọng phải được kiểm tra chặt chẽ. Giá trị lâu dài của sách nằm ở tư duy hợp tác và khả năng thích nghi, không phụ thuộc vào một công cụ cụ thể.\n\nSau khi đọc sách, tôi nhận thấy cần thay đổi cách sử dụng AI: không chỉ để hoàn thành công việc nhanh hơn, mà còn để nâng cao năng lực học tập và làm việc. Trong học tập, tôi sẽ dùng AI để giải thích kiến thức, xây dựng dàn ý, luyện tập phản biện và tìm hướng tiếp cận mới, nhưng vẫn chủ động đọc tài liệu, tự phân tích và hoàn thiện bài làm. Trong công việc, AI có thể hỗ trợ soạn thảo, lập kế hoạch, tổng hợp thông tin và phát triển ý tưởng. Với những kết quả quan trọng, tôi cần kiểm tra độ chính xác và chịu trách nhiệm về nội dung sử dụng.\n\nTôi rút ra ba nguyên tắc: không phụ thuộc hoàn toàn vào AI; luôn kiểm chứng thay vì mặc nhiên tin tưởng câu trả lời; và không ngừng rèn luyện kiến thức, tư duy phản biện, sáng tạo cùng khả năng thích nghi. *Trí Tuệ Đồng Hành* của Ethan Mollick mang đến góc nhìn thiết thực về mối quan hệ giữa con người và AI. Tác phẩm khuyến khích chúng ta hợp tác với AI để mở rộng năng lực, nhưng không trao cho công nghệ quyền quyết định thay con người.\n\nBài học quan trọng nhất tôi nhận được là sử dụng AI không chỉ là biết đặt câu hỏi, mà còn phải biết đánh giá, kiểm chứng và vận dụng kết quả có trách nhiệm. Đối với sinh viên chuẩn bị bước vào thị trường lao động, làm chủ AI có thể tạo lợi thế, nhưng cần dựa trên nền tảng kiến thức, tư duy độc lập, sáng tạo và đạo đức cá nhân.\n\nAI có thể giúp con người làm việc hiệu quả hơn, nhưng con người vẫn xác định mục tiêu, lựa chọn và chịu trách nhiệm. Đó là ý nghĩa cốt lõi của trí tuệ đồng hành.";const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');const root=document.getElementById('article');let list=false;for(const block of source.trim().split(/\n\s*\n/)){const t=block.trim();if(!t)continue;if(t.startsWith('## ')){root.insertAdjacentHTML('beforeend','<h2>'+inline(t.slice(3))+'</h2>');continue}if(t.startsWith('# '))continue;if(t.split('\n').every(x=>/^[-*] /.test(x))){root.insertAdjacentHTML('beforeend','<ul>'+t.split('\n').map(x=>'<li>'+inline(x.replace(/^[-*] /,''))+'</li>').join('')+'</ul>');continue}if(t.startsWith('**')&&t.endsWith('**')){root.insertAdjacentHTML('beforeend','<h3>'+inline(t)+'</h3>');continue}root.insertAdjacentHTML('beforeend','<p>'+t.split('\n').map(inline).join('<br>')+'</p>')}</script></body></html>
